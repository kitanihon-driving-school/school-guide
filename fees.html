<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>追加料金について｜北日本自動車学校</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
      background: #f5f7f5;
      color: #333;
    }

    .container {
      width: min(94%, 720px);
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: min(90%, 450px);
      height: auto;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0 0 8px;
      color: #006b35;
      font-size: 28px;
    }

    .description {
      margin: 0;
      color: #666;
      font-size: 16px;
    }

    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      min-height: 84px;
      padding: 16px 20px;
      background: #fff;
      border: 2px solid #07843f;
      border-radius: 15px;
      text-decoration: none;
      color: #333;
    }

    .menu-button:hover {
      background: #f0faf4;
    }

    .icon {
      width: 44px;
      font-size: 26px;
      flex-shrink: 0;
    }

    .menu-text {
      flex: 1;
    }

    .menu-title {
      display: block;
      color: #006b35;
      font-size: 20px;
      font-weight: bold;
    }

    .menu-sub {
      display: block;
      margin-top: 4px;
      color: #666;
      font-size: 14px;
    }

    .arrow {
      color: #07843f;
      font-size: 28px;
      font-weight: bold;
    }

    .back-button {
      display: block;
      margin-top: 28px;
      padding: 16px;
      text-align: center;
      background: #fff;
      border: 2px solid #07843f;
      border-radius: 15px;
      color: #006b35;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<main class="container">

      車種を選択して追加料金をご確認ください。

  <div class="menu-list">

    <a class="menu-button"
       href="pdf/fee-futsu.pdf"
       target="_blank">
      <span class="icon">🚗</span>

        <span class="menu-title">普通車</span>

      </span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button"
       href="pdf/fee-chugata.pdf"

      </span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button"
       href="pdf/fee-jun-chugata.pdf"
       target="_blank">
      <span class="icon">🚛</span>
      <span class="menu-text">
        <span class="menu-title">準中型車</span>
        <span class="menu-sub">準中型車の追加料金について</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button"
       href="pdf/fee-daitoku.pdf"

    <a class="menu-button"
       href="pdf/fee-nirin.pdf"

    <a class="menu-button"
