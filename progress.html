<!DOCTYPE html>

    }

      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",

      background: #f5f7f5;
      color: #333;
    }

    .container {
      width: min(94%, 720px);
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: min(90%, 430px);
      height: auto;
      display: block;
      margin: 5px auto 15px;
    }

    h1 {
      margin: 5px 0;
      font-size: 26px;
      color: #176b38;
    }

    .description {
      margin: 8px 0 22px;
      font-size: 15px;
      color: #666;
    }

    .menu {
      display: grid;
      gap: 13px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      min-height: 76px;
      padding: 14px 16px;
      background: #fff;
      border: 2px solid #218548;
      border-radius: 13px;
      color: #333;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }

    .menu-button:hover {
      background: #edf7f0;
    }

    .icon {
      width: 42px;
      font-size: 25px;
      flex-shrink: 0;
    }

    .menu-text {
      flex: 1;
    }

    .menu-title {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: #176b38;
    }

    .menu-sub {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: #666;
    }

    .arrow {
      margin-left: 10px;
      font-size: 27px;
      color: #218548;
    }

    .back-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: 2px solid #218548;
      border-radius: 12px;
      background: white;
      color: #176b38;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }
  </style>
</head>
