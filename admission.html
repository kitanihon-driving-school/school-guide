<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>入校時のご案内｜北日本自動車学校</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
      background: #f5f7f5;
      color: #333;
    }

    .container {
      width: min(94%, 720px);
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: min(90%, 430px);
      height: auto;
      display: block;
      margin: 5px auto 15px;
    }

    h1 {
      margin: 5px 0;
      font-size: 26px;
      color: #176b38;
    }

    .description {
      margin: 8px 0 22px;
      font-size: 15px;
      color: #666;
    }

    .menu {
      display: grid;
      gap: 13px;
    }

    .menu-button {
      display: flex;
      align-items: center;
      min-height: 76px;
      padding: 14px 16px;
      background: #fff;
      border: 2px solid #218548;
      border-radius: 13px;
      color: #333;
      text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }

    .menu-button:hover {
      background: #edf7f0;
    }

    .icon {
      width: 42px;
      font-size: 25px;
      flex-shrink: 0;
    }

    .menu-text {
      flex: 1;
    }

    .menu-title {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: #176b38;
    }

    .menu-sub {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: #666;
    }

    .arrow {
      margin-left: 10px;
      font-size: 27px;
      color: #218548;
    }

    .back-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: 2px solid #218548;
      border-radius: 12px;
      background: white;
      color: #176b38;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }
  </style>
</head>

<body>

<main class="container">

  <header class="header">
    <img src="kitanihon_logo.png"
         alt="北日本自動車学校"
         class="logo">

    <h1>入校時のご案内</h1>

    <p class="description">
      ご覧になりたい項目を選択してください。
    </p>
  </header>

  <div class="menu">

    <a class="menu-button"
    href="#"
    onclick="alert('資料は準備中です。'); return false;">
      <span class="icon">📄</span>
      <span class="menu-text">
        <span class="menu-title">入校手続きについて</span>
        <span class="menu-sub">入校時の手続きについてご案内します</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button"
       href="#"
       onclick="alert('資料は準備中です。'); return false;">
      <span class="icon">🎒</span>
      <span class="menu-text">
        <span class="menu-title">必要な持ち物</span>
        <span class="menu-sub">入校時に必要なものをご確認ください</span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a class="menu-button"
       href="#"
       onclick="alert('資料は準備中です。'); return false;">
      <span class="icon">💴</span>
      <span class="menu-text">
        <span class="menu-title">教習料金について</span>
        <span class="menu-sub">料金についてご案内します</span>
      </span>
      <span class="arrow">›</span>
    </a>
<!-- この中のコードは無効になり、画面に表示されません
    <a class="menu-button"
       href="videos.html">
      <span class="icon">🏠</span>
      <span class="menu-text">
        <span class="menu-title">入寮について</span>
        <span class="menu-sub">寮をご利用される方へのご案内です</span>
      </span>
      <span class="arrow">›</span>
    </a>
-->
    <a class="menu-button"
         href="videos.html">
        <span class="icon">🏠</span>
        <span class="menu-text">
          <span class="menu-title">入寮について</span>
          <span class="menu-sub">動画で入寮についてご案内します</span>
        </span>
        <span class="arrow">›</span>
      </a>
    
    <a class="menu-button"
   href="fees.html">
  <span class="icon">💴</span>
  <span class="menu-text">
    <span class="menu-title">追加料金について</span>
    <span class="menu-sub">車種別の追加料金をご確認ください</span>
  </span>
  <span class="arrow">›</span>
</a>

  </div>

  <a href="index.html" class="back-button">
    ← トップページへ戻る
  </a>

</main>

</body>
</html>
