<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>説明動画｜北日本自動車学校</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
      background: #f5f7f5;
      color: #333;
    }

    .container {
      width: min(94%, 720px);
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      width: min(90%, 430px);
      height: auto;
      margin: 5px auto 15px;
      display: block;
    }

    h1 {
      margin: 5px 0;
      font-size: 26px;
      color: #176b38;
    }

    .description {
      margin: 8px 0 22px;
      font-size: 15px;
      color: #666;
    }

    .video-card {
      background: white;
      border: 1px solid #d9e5dc;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .video-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0 0 12px;
      color: #245c36;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 10px;
      background: #000;
    }

    .video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .back-button {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: 2px solid #218548;
      border-radius: 12px;
      background: white;
      color: #176b38;
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .back-button:hover {
      background: #edf7f0;
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <img src="kitanihon_logo.png"
           alt="北日本自動車学校"
           class="logo">

      <h1>説明動画</h1>

      <p class="description">
        入寮について動画でご案内します。
      </p>
    </header>

    <section class="video-card">
      <div class="video-title">🎬 入寮説明（日本語）</div>

      <div class="video-wrap">
        <iframe
          src="https://www.youtube.com/embed/oUqnpZe2AXM"
          title="入寮説明（日本語）"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </section>

    <section class="video-card">
  <div class="video-title">🎬 入寮説明（ベトナム語）</div>

  <div class="video-wrap">
    <iframe
      src="https://www.youtube.com/embed/n5DGcHZHgas"
      title="入寮説明（ベトナム語）"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</section>

<section class="video-card">
  <div class="video-title">🎬 入寮説明（英語）</div>

  <div class="video-wrap">
    <iframe
      src="https://www.youtube.com/embed/cFsd0P_0jmE"
      title="入寮説明（英語）"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</section>

    <a href="index.html" class="back-button">
      ← トップページへ戻る
    </a>

  </main>

</body>
</html>
